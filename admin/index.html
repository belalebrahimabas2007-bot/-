<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنجاز — الإدارة</title><link rel="stylesheet" href="../style.css"></head><body><main><header><h1>لوحة إدارة إنجاز</h1><div>بيئة اختبار فقط</div></header><p id="msg" class="error"></p><section id="login" class="card"><h2>دخول المسؤول</h2><input id="username" placeholder="اسم المستخدم"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="signIn()">دخول</button></section><section id="app"><nav><button onclick="load()">تحديث</button><button class="alt" onclick="logout()">خروج</button></nav><div class="card"><h2>إضافة مادة</h2><input id="subjectTitle" placeholder="اسم المادة"><button onclick="addSubject()">إضافة</button></div><div class="card"><h2>إضافة درس</h2><select id="subjectSelect"></select><input id="lessonTitle" placeholder="اسم الدرس"><button onclick="addLesson()">إضافة</button></div><div id="subjects"></div></section></main><script src="../shared.js"></script><script>
function say(x){document.getElementById("msg").textContent=x}
async function signIn(){try{let r=await api("/api/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});if(r.user.role!=="admin")throw Error("هذا الحساب ليس مسؤولاً");sessionStorage.setItem(key,r.token);await load()}catch(e){say(e.message)}}
async function load(){try{let data=await api("/api/subjects");login.style.display="none";app.style.display="block";subjectSelect.innerHTML=data.map(s=>'<option value="'+s.id+'">'+esc(s.title)+'</option>').join("");subjects.innerHTML=data.map(s=>'<div class="card"><h3>'+esc(s.title)+'</h3>'+s.lessons.map(l=>'<p>'+esc(l.title)+'</p>').join("")+'</div>').join("");say("")}catch(e){say(e.message)}}
async function addSubject(){try{await api("/api/subjects",{method:"POST",body:JSON.stringify({title:subjectTitle.value})});subjectTitle.value="";await load()}catch(e){say(e.message)}}
async function addLesson(){try{await api("/api/lessons",{method:"POST",body:JSON.stringify({subject_id:Number(subjectSelect.value),title:lessonTitle.value})});lessonTitle.value="";await load()}catch(e){say(e.message)}}
function logout(){sessionStorage.removeItem(key);location.reload()}
if(token())load();
</script></body></html>
