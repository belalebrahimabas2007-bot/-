ius:13px;margin:7px 0;background:white}.auth{max-width:480px;margin:24px auto}.auth .primary{width:100%;background:var(--green)}.auth .secondary{width:100%}.message{padding:12px;border-radius:12px;color:#a5372d;background:#fff1ef;margin:12px 0}.info{font-size:12px;color:var(--muted)}.notice{background:#fff8eb;border:1px solid #f4dfbd;border-radius:14px;padding:13px;font-size:13px;color:#8a6532;margin-bottom:16px}.tag{display:inline-block;background:#e8f5ef;color:var(--green);border-radius:8px;padding:3px 8px;font-size:11px}.lesson-actions{display:flex;gap:8px;align-items:center}.mini{border:0;background:var(--green);color:white;padding:8px 12px;border-radius:10px;font-size:12px}.timer{text-align:center;font-size:56px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}.timer-actions{display:flex;gap:8px;justify-content:center}.timer-actions button{flex:1;max-width:200px}.mini-select{max-width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:white}.more-grid{display:grid;gap:12px}.more-grid button{text-align:right;background:white;border:1px solid var(--line);padding:15px;border-radius:15px;color:var(--ink)}@media(max-width:720px){.hero{padding:18px 18px 110px;border-radius:0 0 30px 30px}.brand h1{font-size:27px}.hero-mid h2{font-size:19px}.hero-illus{font-size:43px}.content{padding:0 14px}.stats-card{grid-template-columns:repeat(3,1fr);padding:18px 10px;gap:16px}.progress{grid-column:1/-1;justify-content:center}.stat-cell{border-right:0;border-left:1px solid var(--line)}.stat-cell:last-child{border:0}.stat-cell strong{font-size:21px}.quick{gap:8px}.quick-card{flex-direction:column;text-align:center;padding:12px 4px;gap:5px;border-radius:16px}.quick-card .emoji{width:39px;height:39px;font-size:20px}.quick-card b{font-size:11px}.quick-card small{font-size:9px}.panel{padding:17px}.smart{padding:17px}.smart h2{font-size:17px}.smart button{padding:10px}.nav-item{padding:5px 2px;font-size:9px}.nav-item i{font-size:19px}}@media(m body.dark-mode{--bg:#142a29;--ink:#e9f4ef;--muted:#a5bbb4;--line:#36534d;background:#142a29;color:#e9f4ef}body.dark-mode .panel,body.dark-mode .stats-card,body.dark-mode .subject-card,body.dark-mode .more-grid button{background:#213c38;color:#e9f4ef;border-color:#36534d}body.dark-mode .ring:before{background:#213c38}body.dark-mode .empty{background:#29443f;color:#b7cbc3}body.dark-mode .stat-cell strong{color:#e9f4ef}body.dark-mode .task{border-color:#36534d}body.dark-mode .secondary{background:#33544e;color:#d2f4e8}body.dark-mode .field{background:#29443f;color:#e9f4ef}</style></head><body><div class="shell"><header class="hero"><div class="hero-top"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 64 64" aria-label="شعار إنجاز"><path d="M45 12A24 24 0 1 0 55 27" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M19 32l10 10L51 18" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 13h11v11" fill="none" stroke="#f2994a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>إنجاز</h1><p>خطط، ذاكر، أنجز.</p></div></div><div class="top-actions"><button class="round-btn" aria-label="الإشعارات" onclick="go('notifications')">♧<span class="dot"></span></button><button class="round-btn" aria-label="الإعدادات" onclick="go('more')">⚙</button></div></div><div class="hero-mid"><div><h2>مرحباً بك 👋</h2><p>متابعة مميزة في رحلتك الدراسية</p></div><div class="hero-illus" aria-hidden="true">📚🎓</div></div></header><div class="content"><div id="notice" class="notice hidden"></div><div id="home"><div class="stats-card"><div class="progress"><div id="ring" class="ring" style="--p:0" data-label="0%"></div><div><strong>إنجاز المنهاج</strong><div class="info">خطوة بخطوة نحو هدفك</div></div></div><div class="stat-cell"><strong id="completed">0</strong><span>درس منجز</span></div><div class="stat-cell"><strong id="remaining">0</strong><span>درس متبقٍ</span></div><div class="stat-cell"><strong id="hours">0</strong><span>ساعة دراسة</span></div></div><div class="quick"><button class="quick-card blue" onclick="go('subjects')"><span class="emoji">📖</span><span><b>المواد</b><small>دروسي</small></span></button><button class="quick-card mint" onclick="go('reviews')"><span class="emoji">🔄</span><span><b>المراجعات</b><small id="reviewCount">المستحقة</small></span></button><button class="quick-card peach" onclick="go('stats')"><span class="emoji">📊</span><span><b>التحصيلات</b><small>تقدمي</small></span></button><button class="quick-card lavender" onclick="go('dates')"><span class="emoji">📅</span><span><b>التواريخ المهمة</b><small>مواعيدي</small></span></button></div><section class="panel"><div class="section-head"><h2>📅 خطة اليوم</h2><button class="text-btn" onclick="go('plan')">عرض الخطة كاملة ←</button></div><p class="subline" id="planSummary">الدروس الجديدة والمراجعات المستحقة</p><div id="todayTasks" class="empty">جارٍ تجهيز خطة دراستك.</div><div class="actions"><button class="primary" onclick="go('timer')">▶ بدء جلسة دراسة</button><button class="secondary" onclick="go('timer')">⏱ المؤقت</button></div></section><section class="smart"><div><h2>🧠 الخطة الذكية</h2><p>رتّب دراستك ومراجعاتك بخطوات مدروسة</p></div><button onclick="go('plan')">عرض خطتي</button></section></div><div id="subpage" class="hidden"><div class="page-head"><h2 id="pageTitle"></h2><button class="back" onclick="go('home')">العودة للرئيسية ←</button></div><div id="pageBody"></div></div></div></div><nav class="nav" aria-label="القائمة الرئيسية"><button class="nav-item active" data-nav="home" onclick="go('home')"><i>⌂</i>الرئيسية</button><button class="nav-item" data-nav="subjects" onclick="go('subjects')"><i>📖</i>المواد</button><button class="nav-item" data-nav="reviews" onclick="go('reviews')"><i>🔄</i>المراجعات</button><button class="nav-item" data-nav="plan" onclick="go('plan')"><i>🧠</i>الخطة الذكية</button><button class="nav-item" data-nav="dates" onclick="go('dates')"><i>📅</i>التواريخ</button><button class="nav-item" data-nav="more" onclick="go('more')"><i>☷</i>المزيد</button></nav><script src="../shared.js"></script><script>
let subjects=[],reviews=[],stats={total:0,completed:0},preview=false,active='home',timerEnd=0,timerInterval=null,seconds=25*60,breakMode=false;
const el=id=>document.getElementById(id);const safe=x=>esc(x??'');const today=()=>new Date().toLocaleDateString('en-CA');const storeKey='engazLocalPreviewV2';
function saveLocal(){try{localStorage.setItem(storeKey,JSON.stringify({subjects,reviews}))}catch(e){note('تعذر حفظ التقدم على هذا الجهاز')}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(storeKey)||'null')}catch(e){return null}}
function addDays(days){let d=new Date();d.setDate(d.getDate()+days);return d.toLocaleDateString('en-CA')+'T12:00:00'}
function refreshLocal(){stats={total:subjects.reduce((n,s)=>n+s.lessons.length,0),completed:subjects.reduce((n,s)=>n+s.lessons.filter(l=>l.completed).length,0)};renderHome();if(active!=='home')go(active)}
function resetLocal(){if(!confirm('هل تريد مسح التقدم التجريبي المحفوظ على هذا الجهاز؟'))return;localStorage.removeItem(storeKey);demo();note('تمت إعادة ضبط التجربة المحلية')}
function note(s){el('notice').textContent=s;el('notice').classList.remove('hidden');setTimeout(()=>el('notice')?.classList.add('hidden'),6500)}
function demo(){preview=true;const saved=loadLocal();subjects=saved?.subjects||[{id:1,title:'الرياضيات',lessons:[{id:1,title:'المعادلات',completed:false},{id:2,title:'الهندسة',completed:false},{id:4,title:'الأعداد الحقيقية',completed:false}]},{id:2,title:'اللغة العربية',lessons:[{id:3,title:'النحو',completed:false},{id:5,title:'البلاغة',completed:false}]},{id:3,title:'العلوم',lessons:[{id:6,title:'الخلية',completed:false},{id:7,title:'الطاقة',completed:false}]}];reviews=saved?.reviews||[];refreshLocal();go('home')}
async function load(){try{[subjects,stats,reviews]=await Promise.all([api('/api/subjects'),api('/api/stats'),api('/api/reviews')]);preview=false;renderHome();if(active!=='home')go(active)}catch(e){note('تعذر تحميل البيانات: '+e.message)}}
function pending(){return reviews.filter(r=>!r.completed_at)}
function due(){return pending().filter(r=>r.due_at.slice(0,10)<=today())}
function renderHome(){let p=stats.total?Math.round(100*stats.completed/stats.total):0;el('ring').style.setProperty('--p',p);el('ring').dataset.label=p+'%';el('completed').textContent=stats.completed;el('remaining').textContent=Math.max(0,stats.total-stats.completed);el('hours').textContent='—';el('reviewCount').textContent=due().length+' مستحقة';let fresh=subjects.flatMap(s=>s.lessons.filter(l=>!l.completed).map(l=>({...l,subject:s.title}))).slice(0,3);let rs=due().slice(0,3);el('planSummary').textContent=fresh.length+' دروس جديدة + '+rs.length+' مراجعات مستحقة';let rows=[...fresh.map(l=>taskRow(l.title,l.subject,false,l.id)),...rs.map(r=>taskRow(r.lesson_title,r.subject_title,true,r.lesson_id,r.stage))];el('todayTasks').className=rows.length?'':'empty';el('todayTasks').innerHTML=rows.join('')||'لا توجد مهام مستحقة حالياً.'}
function taskRow(title,subject,isReview,id,stage){return '<div class="task"><span class="task-icon">'+(isReview?'🔄':'📘')+'</span><div class="task-body"><b>'+safe(title)+'</b><small>'+safe(subject)+'</small></div><span class="pill '+(isReview?'review':'')+'">'+(isReview?'مراجعة':'درس جديد')+'</span><input class="check" type="checkbox" aria-label="إنهاء المهمة" onchange="'+(isReview?'reviewPrompt('+id+','+stage+')':'complete('+id+')')+'"></div>'}
async function complete(id){if(preview){let lesson=subjects.flatMap(s=>s.lessons).find(l=>l.id===id);if(!lesson||lesson.completed)return;lesson.completed=true;reviews.push({lesson_id:id,stage:1,subject_title:subjects.find(s=>s.lessons.some(l=>l.id===id)).title,lesson_title:lesson.title,due_at:addDays(3),completed_at:null,rating:null});saveLocal();refreshLocal();note('تم حفظ الدرس على جهازك، والمراجعة الأولى بعد 3 أيام.');return}try{await api('/api/lessons/'+id+'/complete',{method:'POST'});await load();note('تم تسجيل دراسة الدرس وإضافته للمراجعة.')}catch(e){note(e.message);renderHome()}}
function reviewPrompt(id,stage){go('reviews');let box=el('rating-'+id+'-'+stage);if(box)box.focus()}
async function rate(id,stage){if(preview){let r=reviews.find(x=>x.lesson_id===id&&x.stage===stage&&!x.completed_at);if(!r)return;let rating=el('rating-'+id+'-'+stage)?.value;if(!rating)return;r.rating=rating;r.completed_at=new Date().toISOString();if(stage===1){let days={'لم أتذكر':3,'تذكرت بصعوبة':5,'تذكرت معظم المعلومات':7,'أتقنت الدرس':10}[rating];reviews.push({...r,stage:2,due_at:addDays(days),completed_at:null,rating:null})}saveLocal();refreshLocal();note(stage===1?'تمت المراجعة، وحُدد موعد المراجعة الثانية.':'اكتملت مراجعتا الدرس.');return}try{let rating=el('rating-'+id+'-'+stage).value;await api('/api/reviews/'+id+'/'+stage+'/complete',{method:'POST',body:JSON.stringify({rating})});await load();note('تم حفظ المراجعة.')}catch(e){note(e.message)}}
const titles={subjects:'المواد الدراسية',reviews:'المراجعات الذكية',plan:'الخطة الذكية',stats:'التحصيلات',dates:'التواريخ المهمة',timer:'مؤقت الدراسة',more:'المزيد',notifications:'الإشعارات'};
function go(page){if(['plan','reviews','stats','dates','settings'].includes(page)){specialGo(page);return}active=page;el('home').classList.toggle('hidden',page!=='home');el('subpage').classList.toggle('hidden',page==='home');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));if(page==='home'){window.scrollTo(0,0);return}el('pageTitle').textContent=titles[page]||'المادة';let body='';if(page==='subjects'){body=subjects.length?'<div class="subjects-grid">'+subjects.map((s,i)=>{let done=s.lessons.filter(l=>l.completed).length,p=s.lessons.length?Math.round(done*100/s.lessons.length):0;return '<button class="subject-card" onclick="go(\'subject-'+s.id+'\')"><span style="font-size:30px">'+['📘','📗','📙','📕'][i%4]+'</span><b>'+safe(s.title)+'</b><small>'+done+' من '+s.lessons.length+' دروس • '+p+'%</small><div class="bar"><span style="width:'+p+'%"></span></div></button>'}).join('')+'</div>':'<div class="empty">لم تُضف مواد بعد من لوحة الإدارة.</div>'}
else if(page.startsWith('subject-')){let s=subjects.find(x=>String(x.id)===page.slice(8));el('pageTitle').textContent=s?s.title:'المادة';body=s?'<section class="panel">'+(s.lessons.map(l=>'<div class="task"><span class="task-icon">📖</span><div class="task-body"><b>'+safe(l.title)+'</b><small>'+(l.completed?'تمت الدراسة • في نظام المراجعة':'لم يُدرس بعد')+'</small></div>'+(l.completed?'<span class="tag">✓ منجز</span>':'<button class="mini" onclick="complete('+l.id+')">تمت الدراسة</button>')+'</div>').join('')||'<div class="empty">لا توجد دروس بعد.</div>')+'</section>':'<div class="empty">المادة غير موجودة.</div>'}
else if(page==='reviews'){body='<section class="panel"><p class="subline">المراجعات المستحقة والمتأخرة تظهر أولاً.</p>'+(pending().sort((a,b)=>a.due_at.localeCompare(b.due_at)).map(r=>'<div class="task"><span class="task-icon">🔄</span><div class="task-body"><b>'+safe(r.lesson_title)+'</b><small>'+safe(r.subject_title)+' • مراجعة '+r.stage+' • '+safe(r.due_at.slice(0,10))+'</small><select class="mini-select" id="rating-'+r.lesson_id+'-'+r.stage+'"><option value="لم أتذكر">لم أتذكر</option><option value="تذكرت بصعوبة">تذكرت بصعوبة</option><option value="تذكرت معظم المعلومات">تذكرت معظم المعلومات</option><option value="أتقنت الدرس">أتقنت الدرس</option></select></div><button class="mini" onclick="rate('+r.lesson_id+','+r.stage+')">إكمال</button></div>').join('')||'<div class="empty">لا توجد مراجعات معلّقة.</div>')+'</section>'}
else if(page==='plan'){body='<section class="panel"><h3>مهام اليوم</h3><p class="subline">عرض الدروس غير المنجزة والمراجعات المستحقة وفق البيانات المتاحة.</p>'+el('todayTasks').innerHTML+'</section><div class="notice">الجدولة اليومية حسب الساعات والأولويات ما زالت قيد التطوير؛ تظهر هنا الدروس والمراجعات المتاحة.</div>'}
else if(page==='stats'){body='<section class="panel"><h3>تقدمك الدراسي</h3><p>الدروس المنجزة: <b>'+stats.completed+'</b></p><p>إجمالي الدروس: <b>'+stats.total+'</b></p><p>المراجعات المعلقة: <b>'+pending().length+'</b></p><p class="info">ساعات الدراسة التفصيلية تحتاج إلى ربط نظام المؤقت بالسجل.</p></section>'}
else if(page==='dates'){body='<div class="empty">لا توجد مواعيد معروضة حالياً. ربط تواريخ الإدارة لم يكتمل بعد.</div>'}
else if(page==='notifications'){body='<div class="empty">سجل الإشعارات وربط الإشعارات الفورية قيد التنفيذ.</div>'}
else if(page==='timer'){body='<section class="panel"><h3>⏱ جلسة دراسة</h3><p class="subline">25 دقيقة دراسة، ثم 5 دقائق استراحة.</p><div id="timerDisplay" class="timer">25:00</div><div class="timer-actions"><button class="mini" onclick="startTimer()">بدء / متابعة</button><button class="secondary" onclick="pauseTimer()">إيقاف مؤقت</button><button class="secondary" onclick="resetTimer()">إعادة ضبط</button></div><p class="info">المؤقت يعمل بالوقت الفعلي عند مغادرة الصفحة، لكن تسجيل الساعات بالخادم والانتقال التلقائي الكامل لم يكتمل بعد.</p></section>';setTimeout(updateTimer,0)}
else if(page==='more'){body='<div class="more-grid"><button onclick="go(\'settings\')">⚙ الإعدادات</button><button onclick="go(\'notifications\')">🔔 الإشعارات</button><button onclick="go(\'stats\')">📊 التحصيلات</button><button onclick="go(\'dates\')">📅 التواريخ المهمة</button><button onclick="resetLocal()">🧹 إعادة ضبط التقدم التجريبي</button></div><p class="info">البيانات التجريبية تُحفظ على هذا الجهاز فقط، ولا تتزامن مع لوحة الإدارة حالياً.</p>'}

el('pageBody').innerHTML=body;window.scrollTo(0,0)}
function updateTimer(){let s=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):seconds;if(timerEnd&&s===0){timerEnd=0;breakMode=!breakMode;seconds=(breakMode?5:25)*60;note(breakMode?'انتهت الدراسة، حان وقت الاستراحة.':'انتهت الاستراحة، يمكنك بدء الدراسة.')}else seconds=s;let d=el('timerDisplay');if(d)d.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startTimer(){if(!timerEnd){timerEnd=Date.now()+seconds*1000;timerInterval=setInterval(updateTimer,1000)}}
function pauseTimer(){if(timerEnd){seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=0;clearInterval(timerInterval);updateTimer()}}
function resetTimer(){pauseTimer();breakMode=false;seconds=25*60;updateTimer()}

const configKey='engazSettingsV1', datesKey='engazDateNotesV1',timerKey='engazTimerV1';
let cfg=Object.assign({mode:'smart',hours:3,days:30,reviewDays:15,study:25,rest:5,difficult:[],manual:[],fullReview:false,dark:false},JSON.parse(localStorage.getItem(configKey)||'{}'));
let dateNotes=JSON.parse(localStorage.getItem(datesKey)||'{}');
function saveCfg(){localStorage.setItem(configKey,JSON.stringify(cfg))}
function applyTheme(){document.body.classList.toggle('dark-mode',!!cfg.dark)}
function setConfig(field,val){cfg[field]=val;saveCfg();specialGo('plan')}
function toggleDark(){cfg.dark=!cfg.dark;saveCfg();applyTheme();specialGo('settings')}
function upcoming(){let all=subjects.flatMap(s=>s.lessons.filter(l=>!l.completed).map(l=>({...l,subject:s.title})));if(cfg.mode==='manual'){let ids=cfg.manual.map(Number);return ids.map(id=>all.find(l=>l.id===id)).filter(Boolean)}return all.sort((a,b)=>Number(cfg.difficult.includes(a.subject))*-1-Number(cfg.difficult.includes(b.subject))*-1).slice(0,Math.max(1,Math.floor(cfg.hours)))}
function addManual(id){id=Number(id);if(!cfg.manual.includes(id))cfg.manual.push(id);saveCfg();specialGo('plan')}
function removeManual(id){cfg.manual=cfg.manual.filter(x=>x!==id);saveCfg();specialGo('plan')}
function planView(){let available=subjects.flatMap(s=>s.lessons.filter(l=>!l.completed).map(l=>({...l,subject:s.title})));let estimate=Math.ceil(available.length/Math.max(1,Math.floor(cfg.hours)));let selected=upcoming();return '<section class="panel"><h3>نوع الخطة</h3><div class="actions"><button class="'+(cfg.mode==='smart'?'mini':'secondary')+'" onclick="setConfig(\'mode\',\'smart\')">🧠 ذكية</button><button class="'+(cfg.mode==='manual'?'mini':'secondary')+'" onclick="setConfig(\'mode\',\'manual\')">✍ يدوية</button></div><label>ساعات الدراسة يومياً <b>'+cfg.hours+'</b></label><input class="field" type="range" min="1" max="12" value="'+cfg.hours+'" onchange="setConfig(\'hours\',Number(this.value))"><label>عدد أيام إنهاء المنهاج</label><input class="field" type="number" min="1" max="365" value="'+cfg.days+'" onchange="setConfig(\'days\',Math.max(1,Number(this.value)||1))"><p class="info">التقدير الأولي لإنهاء الدروس المتبقية: '+estimate+' يوم (بحساب تقريبي درس لكل ساعة؛ يحتاج ضبط حسب صعوبة الدروس).</p>'+(cfg.days<estimate?'<div class="notice">المدة المختارة قد تكون غير واقعية. نقترح '+estimate+' يوماً على الأقل حسب الوقت المتاح.</div>':'')+'</section><section class="panel"><h3>مهام الدروس الجديدة</h3><p class="subline">'+(cfg.mode==='manual'?'اختر الدروس بنفسك من المنهاج.':'اقتراح أولي بحسب الساعات المتاحة؛ المراجعات المستحقة لها الأولوية.')+'</p>'+(selected.map(l=>'<div class="task"><span class="task-icon">📘</span><div class="task-body"><b>'+safe(l.title)+'</b><small>'+safe(l.subject)+'</small></div><button class="mini" onclick="complete('+l.id+')">تمت الدراسة</button>'+(cfg.mode==='manual'?'<button class="secondary" onclick="removeManual('+l.id+')">إزالة</button>':'')+'</div>').join('')||'<div class="empty">لا توجد دروس في الخطة.</div>')+(cfg.mode==='manual'?'<label>إضافة درس من المنهاج</label><select class="field" id="manualLesson">'+available.map(l=>'<option value="'+l.id+'">'+safe(l.subject)+' — '+safe(l.title)+'</option>').join('')+'</select><button class="mini" onclick="addManual(Number(el(\'manualLesson\').value))">إضافة للخطة</button>':'')+'</section><section class="panel"><h3>المراجعات المستحقة والمتأخرة</h3>'+(due().map(r=>'<div class="task"><div class="task-body"><b>'+safe(r.lesson_title)+'</b><small>'+safe(r.subject_title)+'</small></div><button class="mini" onclick="go(\'reviews\')">مراجعة</button></div>').join('')||'<p class="subline">لا توجد مراجعات مستحقة.</p>')+'</section>'+(stats.total>0&&stats.completed===stats.total?'<section class="panel"><h3>مراجعة المنهاج كاملاً</h3><label>عدد الأيام</label><input class="field" id="fullDays" type="number" min="1" value="'+cfg.reviewDays+'"><button class="mini" onclick="startFullReview()">بدء دورة المراجعة الشاملة</button></section>':'')+(cfg.fullReview?'<section class="panel"><h3>دورة المراجعة الشاملة</h3><p>المدة: '+cfg.reviewDays+' يوماً</p><p>عدد الدروس: '+stats.total+'</p><p class="info">هذه الدورة مستقلة عن المراجعتين الآليتين.</p></section>':'')}
function startFullReview(){cfg.reviewDays=Math.max(1,Number(el('fullDays').value)||1);cfg.fullReview=true;saveCfg();specialGo('plan')}
function delayReview(id,stage){let r=reviews.find(x=>x.lesson_id===id&&x.stage===stage&&!x.completed_at);if(!r)return;let v=prompt('أدخل تاريخ المراجعة الجديد YYYY-MM-DD',r.due_at.slice(0,10));if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v)||!Number.isFinite(Date.parse(v)))return;r.original_due_at??=r.due_at;r.due_at=v+'T12:00:00';saveLocal();specialGo('reviews')}
function reviewsView(){return '<section class="panel"><h3>المراجعات المجدولة</h3><p class="subline">يمكن المراجعة قبل الموعد أو تأجيلها، ولا تُحذف المراجعات الفائتة.</p>'+(pending().sort((a,b)=>a.due_at.localeCompare(b.due_at)).map(r=>'<div class="task"><span class="task-icon">🔄</span><div class="task-body"><b>'+safe(r.lesson_title)+'</b><small>'+safe(r.subject_title)+' • المراجعة '+r.stage+' • '+safe(r.due_at.slice(0,10))+(r.original_due_at?' • الأصل '+safe(r.original_due_at.slice(0,10)):'')+'</small><select class="mini-select" id="rating-'+r.lesson_id+'-'+r.stage+'"><option>لم أتذكر</option><option>تذكرت بصعوبة</option><option>تذكرت معظم المعلومات</option><option>أتقنت الدرس</option></select></div><button class="mini" onclick="rate('+r.lesson_id+','+r.stage+')">إكمال</button><button class="secondary" onclick="delayReview('+r.lesson_id+','+r.stage+')">تأجيل</button></div>').join('')||'<div class="empty">لا توجد مراجعات معلقة.</div>')+'</section><section class="panel"><h3>سجل المراجعات المكتملة</h3>'+(reviews.filter(r=>r.completed_at).map(r=>'<div class="task"><div class="task-body"><b>'+safe(r.lesson_title)+'</b><small>المراجعة '+r.stage+' • '+safe(r.rating)+' • '+safe(r.completed_at.slice(0,10))+'</small></div><span class="tag">مكتملة</span></div>').join('')||'<p class="subline">لا توجد مراجعات مكتملة بعد.</p>')+'</section>'}
function settingsView(){return '<section class="panel"><h3>إعدادات الدراسة</h3><p>الخطة: '+(cfg.mode==='smart'?'ذكية':'يدوية')+'</p><p>الساعات اليومية: '+cfg.hours+'</p><button class="mini" onclick="specialGo(\'plan\')">تعديل الخطة</button></section><section class="panel"><h3>المظهر</h3><p>المظهر الحالي: '+(cfg.dark?'ليلي':'نهاري')+'</p><button class="mini" onclick="toggleDark()">تبديل المظهر</button></section><section class="panel"><h3>بيانات التجربة</h3><p class="info">تُحفظ البيانات على هذا المتصفح فقط حتى ربط الحسابات والمزامنة الآمنة.</p><button class="secondary" onclick="resetLocal()">إعادة ضبط التقدم التجريبي</button></section>'}
function statsView(){let by=subjects.map(s=>{let done=s.lessons.filter(l=>l.completed).length;return '<div class="task"><div class="task-body"><b>'+safe(s.title)+'</b><small>'+done+' من '+s.lessons.length+' دروس</small><div class="bar"><span style="width:'+(s.lessons.length?Math.round(100*done/s.lessons.length):0)+'%"></span></div></div></div>'}).join('');return '<section class="panel"><h3>التحصيلات</h3><p>إنجاز المنهاج: <b>'+(stats.total?Math.round(100*stats.completed/stats.total):0)+'%</b></p><p>الدروس المنجزة: <b>'+stats.completed+'</b> من '+stats.total+'</p><p>المراجعات المكتملة: <b>'+reviews.filter(r=>r.completed_at).length+'</b></p><p>المراجعات المتأخرة: <b>'+due().filter(r=>r.due_at.slice(0,10)<today()).length+'</b></p>'+by+'</section><div class="notice">تقارير PDF المفصلة والإتقان وساعات الدراسة المتزامنة ما زالت بحاجة تنفيذ وربط.</div>'}
function datesView(){return '<section class="panel"><h3>التواريخ المهمة</h3><p class="subline">المواعيد الرسمية يضيفها المسؤول فقط؛ تستطيع إضافة ملاحظة شخصية لأي موعد عند توفره.</p><div class="empty">لم تُنشر مواعيد رسمية في هذه النسخة بعد.</div></section>'}
function specialGo(page){active=page;el('home').classList.add('hidden');el('subpage').classList.remove('hidden');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));el('pageTitle').textContent=({plan:'الخطة الذكية واليدوية',reviews:'المراجعات الذكية',stats:'التحصيلات',dates:'التواريخ المهمة',settings:'الإعدادات'})[page];el('pageBody').innerHTML=({plan:planView,reviews:reviewsView,stats:statsView,dates:datesView,settings:settingsView})[page]();window.scrollTo(0,0)}
applyTheme();

renderHome();demo();
</script></body></html>
