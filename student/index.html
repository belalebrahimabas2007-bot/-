<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F766E"><title>إنجاز — الطلاب</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--green:#0f766e;--dark:#064c48;--orange:#f2994a;--bg:#f3f8f6;--ink:#173c38;--muted:#718783;--line:#e5eeea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.shell{max-width:1180px;margin:auto;padding-bottom:112px}.hero{background:linear-gradient(128deg,#063f43,#0f766e 72%,#178b7e);color:white;padding:26px 28px 112px;position:relative;overflow:hidden;border-radius:0 0 42px 42px}.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff1c;border-radius:50%;width:340px;height:340px;left:-100px;top:-185px}.hero:after{width:240px;height:240px;left:12%;top:95px}.hero-top,.hero-mid,.section-head,.task,.nav,.nav-item,.quick,.quick-card,.stats,.stat-cell,.actions,.brand,.top-actions{display:flex;align-items:center}.hero-top,.hero-mid,.section-head{justify-content:space-between}.hero-top{position:relative;z-index:1}.brand{gap:12px}.brand-mark{width:60px;height:60px;background:#ffffff17;border-radius:17px;display:grid;place-items:center}.brand-mark svg{width:48px;height:48px}.brand h1{font-size:32px;line-height:1.1;margin:0;font-weight:900}.brand p{margin:2px 0 0;font-size:12px;color:#d6f4ed}.top-actions{gap:10px}.round-btn{width:43px;height:43px;border:1px solid #ffffff42;background:#ffffff1c;color:white;border-radius:15px;font-size:21px;position:relative}.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:#ff785e;border-radius:50%}.hero-mid{position:relative;z-index:1;margin-top:26px}.hero-mid h2{font-size:24px;margin:0}.hero-mid p{margin:4px 0 0;color:#d6eee8;font-size:14px}.hero-illus{font-size:62px;filter:drop-shadow(0 7px 8px #003b3a66)}.content{padding:0 22px}.stats-card{position:relative;margin:-80px 0 22px;background:white;border-radius:26px;box-shadow:0 15px 40px #003f3a16;padding:25px 18px;display:grid;grid-template-columns:1.2fr repeat(3,1fr);align-items:center;gap:10px}.progress{display:flex;align-items:center;gap:15px}.ring{--p:0;background:conic-gradient(var(--green) calc(var(--p)*1%),#e5f0ed 0);width:105px;height:105px;flex-shrink:0;border-radius:50%;display:grid;place-items:center}.ring:before{content:attr(data-label);width:79px;height:79px;border-radius:50%;background:white;display:grid;place-items:center;color:var(--green);font-size:23px;font-weight:900}.progress strong{font-size:16px}.stat-cell{flex-direction:column;justify-content:center;border-right:1px solid var(--line);gap:2px}.stat-cell strong{font-size:26px;color:var(--dark)}.stat-cell span{font-size:12px;color:var(--muted)}.quick{gap:13px;margin:22px 0}.quick-card{border:0;flex:1;min-width:0;border-radius:22px;padding:17px 12px;gap:12px;text-align:right;color:var(--ink);box-shadow:0 6px 16px #184c4410}.quick-card .emoji{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:#ffffffaa;font-size:24px}.quick-card b{font-size:15px}.quick-card small{display:block;font-size:11px;color:#5e7771}.blue{background:#e8f1ff}.mint{background:#e3f5e9}.peach{background:#fff0df}.lavender{background:#f0eaff}.panel{background:white;border-radius:25px;padding:23px;box-shadow:0 6px 23px #184c440d;margin-bottom:18px}.section-head{gap:10px;margin-bottom:17px}.section-head h2{margin:0;font-size:20px}.text-btn{background:none;border:0;color:#7459c6;font-size:13px;font-weight:800}.subline{color:var(--muted);font-size:13px;margin:0 0 13px}.task{gap:12px;padding:12px 0;border-bottom:1px solid #eef3f1}.task-icon{width:43px;height:43px;display:grid;place-items:center;border-radius:13px;background:#e9f3f1;font-size:21px}.task-body{flex:1;min-width:0}.task-body b{display:block;font-size:14px}.task-body small{color:var(--muted);font-size:11px}.pill{font-size:10px;color:#307eb2;background:#e8f4ff;padding:5px 9px;border-radius:99px;white-space:nowrap}.pill.review{color:#bf7339;background:#fff0df}.check{width:22px;height:22px;accent-color:var(--green);cursor:pointer}.actions{gap:12px;margin-top:19px}.primary,.secondary{border:0;border-radius:15px;padding:13px 18px;font-weight:800}.primary{background:linear-gradient(110deg,#7960d8,#9d78e5);color:white;flex:1}.secondary{background:#f0f5f3;color:var(--green)}.smart{background:linear-gradient(110deg,#07514f,#128779);border-radius:23px;color:white;padding:23px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.smart h2{margin:0;font-size:20px}.smart p{margin:4px 0;color:#d9f3ee;font-size:13px}.smart button{background:white;color:var(--green);border:0;padding:11px 20px;border-radius:13px;font-weight:800;white-space:nowrap}.nav{position:fixed;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);max-width:920px;width:calc(100% - 24px);background:#064e49;border-radius:22px;padding:10px;box-shadow:0 10px 35px #053c3b4a;justify-content:space-around}.nav-item{border:0;background:none;color:#c8e2db;flex-direction:column;gap:2px;min-width:0;padding:5px 8px;border-radius:12px;font-size:11px}.nav-item i{font-style:normal;font-size:22px}.nav-item.active{color:#ffb56d;background:#ffffff12}.hidden{display:none!important}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.page-head h2{margin:0}.back{background:#e3eeea;color:var(--green);border:0;border-radius:12px;padding:8px 13px}.subjects-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.subject-card{background:white;border:1px solid var(--line);border-radius:20px;padding:20px;text-align:right;box-shadow:0 4px 14px #184c440a}.subject-card b{display:block;font-size:18px}.subject-card small{color:var(--muted)}.bar{height:9px;background:#e8f1ed;border-radius:9px;overflow:hidden;margin-top:14px}.bar span{display:block;height:100%;background:var(--green);border-radius:9px}.empty{padding:22px;text-align:center;color:var(--muted);background:#f6faf8;border-radius:15px}.field{width:100%;padding:12px;border:1px solid #d7e6df;border-radius:13px;margin:7px 0;background:white}.auth{max-width:480px;margin:24px auto}.auth .primary{width:100%;background:var(--green)}.auth .secondary{width:100%}.message{padding:12px;border-radius:12px;color:#a5372d;background:#fff1ef;margin:12px 0}.info{font-size:12px;color:var(--muted)}.notice{background:#fff8eb;border:1px solid #f4dfbd;border-radius:14px;padding:13px;font-size:13px;color:#8a6532;margin-bottom:16px}.tag{display:inline-block;background:#e8f5ef;color:var(--green);border-radius:8px;padding:3px 8px;font-size:11px}.lesson-actions{display:flex;gap:8px;align-items:center}.mini{border:0;background:var(--green);color:white;padding:8px 12px;border-radius:10px;font-size:12px}.timer{text-align:center;font-size:56px;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}.timer-actions{display:flex;gap:8px;justify-content:center}.timer-actions button{flex:1;max-width:200px}.mini-select{max-width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;background:white}.more-grid{display:grid;gap:12px}.more-grid button{text-align:right;background:white;border:1px solid var(--line);padding:15px;border-radius:15px;color:var(--ink)}@media(max-width:720px){.hero{padding:18px 18px 110px;border-radius:0 0 30px 30px}.brand h1{font-size:27px}.hero-mid h2{font-size:19px}.hero-illus{font-size:43px}.content{padding:0 14px}.stats-card{grid-template-columns:repeat(3,1fr);padding:18px 10px;gap:16px}.progress{grid-column:1/-1;justify-content:center}.stat-cell{border-right:0;border-left:1px solid var(--line)}.stat-cell:last-child{border:0}.stat-cell strong{font-size:21px}.quick{gap:8px}.quick-card{flex-direction:column;text-align:center;padding:12px 4px;gap:5px;border-radius:16px}.quick-card .emoji{width:39px;height:39px;font-size:20px}.quick-card b{font-size:11px}.quick-card small{font-size:9px}.panel{padding:17px}.smart{padding:17px}.smart h2{font-size:17px}.smart button{padding:10px}.nav-item{padding:5px 2px;font-size:9px}.nav-item i{font-size:19px}}@media(max-width:390px){.quick-card b{font-size:10px}.smart{flex-wrap:wrap}.subjects-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="hero"><div class="hero-top"><div class="brand"><div class="brand-mark"><svg viewBox="0 0 64 64" aria-label="شعار إنجاز"><path d="M45 12A24 24 0 1 0 55 27" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M19 32l10 10L51 18" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M45 13h11v11" fill="none" stroke="#f2994a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>إنجاز</h1><p>خطط، ذاكر، أنجز.</p></div></div><div class="top-actions"><button class="round-btn" aria-label="الإشعارات" onclick="go('notifications')">♧<span class="dot"></span></button><button class="round-btn" aria-label="الإعدادات" onclick="go('more')">⚙</button></div></div><div class="hero-mid"><div><h2>مرحباً بك 👋</h2><p>متابعة مميزة في رحلتك الدراسية</p></div><div class="hero-illus" aria-hidden="true">📚🎓</div></div></header><div class="content"><div id="notice" class="notice hidden"></div><div id="home"><div class="stats-card"><div class="progress"><div id="ring" class="ring" style="--p:0" data-label="0%"></div><div><strong>إنجاز المنهاج</strong><div class="info">خطوة بخطوة نحو هدفك</div></div></div><div class="stat-cell"><strong id="completed">0</strong><span>درس منجز</span></div><div class="stat-cell"><strong id="remaining">0</strong><span>درس متبقٍ</span></div><div class="stat-cell"><strong id="hours">0</strong><span>ساعة دراسة</span></div></div><div class="quick"><button class="quick-card blue" onclick="go('subjects')"><span class="emoji">📖</span><span><b>المواد</b><small>دروسي</small></span></button><button class="quick-card mint" onclick="go('reviews')"><span class="emoji">🔄</span><span><b>المراجعات</b><small id="reviewCount">المستحقة</small></span></button><button class="quick-card peach" onclick="go('stats')"><span class="emoji">📊</span><span><b>التحصيلات</b><small>تقدمي</small></span></button><button class="quick-card lavender" onclick="go('dates')"><span class="emoji">📅</span><span><b>التواريخ المهمة</b><small>مواعيدي</small></span></button></div><section class="panel"><div class="section-head"><h2>📅 خطة اليوم</h2><button class="text-btn" onclick="go('plan')">عرض الخطة كاملة ←</button></div><p class="subline" id="planSummary">الدروس الجديدة والمراجعات المستحقة</p><div id="todayTasks" class="empty">سجّل الدخول لعرض خطة دراستك.</div><div class="actions"><button class="primary" onclick="go('timer')">▶ بدء جلسة دراسة</button><button class="secondary" onclick="go('timer')">⏱ المؤقت</button></div></section><section class="smart"><div><h2>🧠 الخطة الذكية</h2><p>رتّب دراستك ومراجعاتك بخطوات مدروسة</p></div><button onclick="go('plan')">عرض خطتي</button></section></div><div id="subpage" class="hidden"><div class="page-head"><h2 id="pageTitle"></h2><button class="back" onclick="go('home')">العودة للرئيسية ←</button></div><div id="pageBody"></div></div></div></div><nav class="nav" aria-label="القائمة الرئيسية"><button class="nav-item active" data-nav="home" onclick="go('home')"><i>⌂</i>الرئيسية</button><button class="nav-item" data-nav="subjects" onclick="go('subjects')"><i>📖</i>المواد</button><button class="nav-item" data-nav="reviews" onclick="go('reviews')"><i>🔄</i>المراجعات</button><button class="nav-item" data-nav="plan" onclick="go('plan')"><i>🧠</i>الخطة الذكية</button><button class="nav-item" data-nav="dates" onclick="go('dates')"><i>📅</i>التواريخ</button><button class="nav-item" data-nav="more" onclick="go('more')"><i>☷</i>المزيد</button></nav><script src="../shared.js"></script><script>
let subjects=[],reviews=[],stats={total:0,completed:0},preview=false,active='home',timerEnd=0,timerInterval=null,seconds=25*60,breakMode=false;
const el=id=>document.getElementById(id);const safe=x=>esc(x??'');const today=()=>new Date().toISOString().slice(0,10);
function note(s){el('notice').textContent=s;el('notice').classList.remove('hidden');setTimeout(()=>el('notice')?.classList.add('hidden'),6500)}
function demo(){preview=true;subjects=[{id:1,title:'الرياضيات',lessons:[{id:1,title:'المعادلات',completed:true},{id:2,title:'الهندسة',completed:false}]},{id:2,title:'اللغة العربية',lessons:[{id:3,title:'النحو',completed:false}]}];reviews=[{lesson_id:1,stage:1,subject_title:'الرياضيات',lesson_title:'المعادلات',due_at:today(),completed_at:null}];stats={total:3,completed:1};renderHome();go('home');note('أنت في وضع المعاينة؛ الأرقام والمواد أمثلة ولا تُحفظ التغييرات.')}
async function load(){try{[subjects,stats,reviews]=await Promise.all([api('/api/subjects'),api('/api/stats'),api('/api/reviews')]);preview=false;renderHome();if(active!=='home')go(active)}catch(e){note('تعذر تحميل البيانات: '+e.message)}}
function pending(){return reviews.filter(r=>!r.completed_at)}
function due(){return pending().filter(r=>r.due_at.slice(0,10)<=today())}
function renderHome(){let p=stats.total?Math.round(100*stats.completed/stats.total):0;el('ring').style.setProperty('--p',p);el('ring').dataset.label=p+'%';el('completed').textContent=stats.completed;el('remaining').textContent=Math.max(0,stats.total-stats.completed);el('hours').textContent='—';el('reviewCount').textContent=due().length+' مستحقة';let fresh=subjects.flatMap(s=>s.lessons.filter(l=>!l.completed).map(l=>({...l,subject:s.title}))).slice(0,3);let rs=due().slice(0,3);el('planSummary').textContent=fresh.length+' دروس جديدة + '+rs.length+' مراجعات مستحقة';let rows=[...fresh.map(l=>taskRow(l.title,l.subject,false,l.id)),...rs.map(r=>taskRow(r.lesson_title,r.subject_title,true,r.lesson_id,r.stage))];el('todayTasks').className=rows.length?'':'empty';el('todayTasks').innerHTML=rows.join('')||'لا توجد مهام مستحقة حالياً.'}
function taskRow(title,subject,isReview,id,stage){return '<div class="task"><span class="task-icon">'+(isReview?'🔄':'📘')+'</span><div class="task-body"><b>'+safe(title)+'</b><small>'+safe(subject)+'</small></div><span class="pill '+(isReview?'review':'')+'">'+(isReview?'مراجعة':'درس جديد')+'</span><input class="check" type="checkbox" aria-label="إنهاء المهمة" onchange="'+(isReview?'reviewPrompt('+id+','+stage+')':'complete('+id+')')+'"></div>'}
async function complete(id){if(preview){note('هذه معاينة فقط. سجّل الدخول لحفظ تقدمك.');renderHome();return}try{await api('/api/lessons/'+id+'/complete',{method:'POST'});await load();note('تم تسجيل دراسة الدرس وإضافته للمراجعة.')}catch(e){note(e.message);renderHome()}}
function reviewPrompt(id,stage){go('reviews');let box=el('rating-'+id+'-'+stage);if(box)box.focus()}
async function rate(id,stage){if(preview){note('لا يمكن حفظ المراجعة في وضع المعاينة.');return}try{let rating=el('rating-'+id+'-'+stage).value;await api('/api/reviews/'+id+'/'+stage+'/complete',{method:'POST',body:JSON.stringify({rating})});await load();note('تم حفظ المراجعة.')}catch(e){note(e.message)}}
const titles={subjects:'المواد الدراسية',reviews:'المراجعات الذكية',plan:'الخطة الذكية',stats:'التحصيلات',dates:'التواريخ المهمة',timer:'مؤقت الدراسة',more:'المزيد',notifications:'الإشعارات'};
function go(page){active=page;el('home').classList.toggle('hidden',page!=='home');el('subpage').classList.toggle('hidden',page==='home');document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===page));if(page==='home'){window.scrollTo(0,0);return}el('pageTitle').textContent=titles[page]||'المادة';let body='';if(page==='subjects'){body=subjects.length?'<div class="subjects-grid">'+subjects.map((s,i)=>{let done=s.lessons.filter(l=>l.completed).length,p=s.lessons.length?Math.round(done*100/s.lessons.length):0;return '<button class="subject-card" onclick="go(\'subject-'+s.id+'\')"><span style="font-size:30px">'+['📘','📗','📙','📕'][i%4]+'</span><b>'+safe(s.title)+'</b><small>'+done+' من '+s.lessons.length+' دروس • '+p+'%</small><div class="bar"><span style="width:'+p+'%"></span></div></button>'}).join('')+'</div>':'<div class="empty">لم تُضف مواد بعد من لوحة الإدارة.</div>'}
else if(page.startsWith('subject-')){let s=subjects.find(x=>String(x.id)===page.slice(8));el('pageTitle').textContent=s?s.title:'المادة';body=s?'<section class="panel">'+(s.lessons.map(l=>'<div class="task"><span class="task-icon">📖</span><div class="task-body"><b>'+safe(l.title)+'</b><small>'+(l.completed?'تمت الدراسة • في نظام المراجعة':'لم يُدرس بعد')+'</small></div>'+(l.completed?'<span class="tag">✓ منجز</span>':'<button class="mini" onclick="complete('+l.id+')">تمت الدراسة</button>')+'</div>').join('')||'<div class="empty">لا توجد دروس بعد.</div>')+'</section>':'<div class="empty">المادة غير موجودة.</div>'}
else if(page==='reviews'){body='<section class="panel"><p class="subline">المراجعات المستحقة والمتأخرة تظهر أولاً.</p>'+(pending().sort((a,b)=>a.due_at.localeCompare(b.due_at)).map(r=>'<div class="task"><span class="task-icon">🔄</span><div class="task-body"><b>'+safe(r.lesson_title)+'</b><small>'+safe(r.subject_title)+' • مراجعة '+r.stage+' • '+safe(r.due_at.slice(0,10))+'</small><select class="mini-select" id="rating-'+r.lesson_id+'-'+r.stage+'"><option value="لم أتذكر">لم أتذكر</option><option value="تذكرت بصعوبة">تذكرت بصعوبة</option><option value="تذكرت معظم المعلومات">تذكرت معظم المعلومات</option><option value="أتقنت الدرس">أتقنت الدرس</option></select></div><button class="mini" onclick="rate('+r.lesson_id+','+r.stage+')">إكمال</button></div>').join('')||'<div class="empty">لا توجد مراجعات معلّقة.</div>')+'</section>'}
else if(page==='plan'){body='<section class="panel"><h3>مهام اليوم</h3><p class="subline">عرض الدروس غير المنجزة والمراجعات المستحقة وفق البيانات المتاحة.</p>'+el('todayTasks').innerHTML+'</section><div class="notice">الجدولة اليومية الذكية حسب الساعات والأولويات لم تُربط بعد بالخادم؛ هذا عرض أولي للمهام المتاحة.</div>'}
else if(page==='stats'){body='<section class="panel"><h3>تقدمك الدراسي</h3><p>الدروس المنجزة: <b>'+stats.completed+'</b></p><p>إجمالي الدروس: <b>'+stats.total+'</b></p><p>المراجعات المعلقة: <b>'+pending().length+'</b></p><p class="info">ساعات الدراسة التفصيلية تحتاج إلى ربط نظام المؤقت بالسجل.</p></section>'}
else if(page==='dates'){body='<div class="empty">لا توجد مواعيد معروضة حالياً. ربط تواريخ الإدارة لم يكتمل بعد.</div>'}
else if(page==='notifications'){body='<div class="empty">سجل الإشعارات وربط الإشعارات الفورية قيد التنفيذ.</div>'}
else if(page==='timer'){body='<section class="panel"><h3>⏱ جلسة دراسة</h3><p class="subline">25 دقيقة دراسة، ثم 5 دقائق استراحة.</p><div id="timerDisplay" class="timer">25:00</div><div class="timer-actions"><button class="mini" onclick="startTimer()">بدء / متابعة</button><button class="secondary" onclick="pauseTimer()">إيقاف مؤقت</button><button class="secondary" onclick="resetTimer()">إعادة ضبط</button></div><p class="info">المؤقت يعمل بالوقت الفعلي عند مغادرة الصفحة، لكن تسجيل الساعات بالخادم والانتقال التلقائي الكامل لم يكتمل بعد.</p></section>';setTimeout(updateTimer,0)}
else if(page==='more'){body='<div class="more-grid"><button onclick="go(\'notifications\')">🔔 الإشعارات</button><button onclick="go(\'stats\')">📊 التحصيلات</button><button onclick="go(\'dates\')">📅 التواريخ المهمة</button></div>'}

el('pageBody').innerHTML=body;window.scrollTo(0,0)}
function updateTimer(){let s=timerEnd?Math.max(0,Math.ceil((timerEnd-Date.now())/1000)):seconds;if(timerEnd&&s===0){timerEnd=0;breakMode=!breakMode;seconds=(breakMode?5:25)*60;note(breakMode?'انتهت الدراسة، حان وقت الاستراحة.':'انتهت الاستراحة، يمكنك بدء الدراسة.')}else seconds=s;let d=el('timerDisplay');if(d)d.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function startTimer(){if(!timerEnd){timerEnd=Date.now()+seconds*1000;timerInterval=setInterval(updateTimer,1000)}}
function pauseTimer(){if(timerEnd){seconds=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerEnd=0;clearInterval(timerInterval);updateTimer()}}
function resetTimer(){pauseTimer();breakMode=false;seconds=25*60;updateTimer()}
renderHome();demo();
</script></body></html>
