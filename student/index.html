<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنجاز — الطلاب</title><link rel="stylesheet" href="../style.css"></head><body><main><header><h1>إنجاز</h1><div>خطط، ذاكر، أنجز.</div><small style="color:white">نسخة اختبار — ليست للاستخدام الفعلي</small></header><p id="msg" class="error"></p><section id="login" class="card"><h2>دخول الطالب</h2><input id="username" placeholder="اسم المستخدم" autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password"><button onclick="signIn()">دخول</button><button class="alt" onclick="register()">إنشاء حساب تجريبي</button></section><section id="app"><nav><button onclick="load()">تحديث</button><button class="alt" onclick="logout()">خروج</button></nav><div class="card"><h2>تقدمي</h2><div id="stats"></div></div><div class="card"><h2>المراجعات الذكية</h2><div id="reviews"></div></div><div id="subjects"></div></section></main><script src="../shared.js"></script><script>
function say(x){document.getElementById("msg").textContent=x}
async function signIn(){try{let r=await api("/api/login",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});if(r.user.role!=="student")throw Error("هذا الحساب ليس للطلاب");sessionStorage.setItem(key,r.token);await load()}catch(e){say(e.message)}}
async function register(){try{await api("/api/register",{method:"POST",body:JSON.stringify({username:username.value,password:password.value})});say("تم إنشاء الحساب التجريبي. اضغط دخول.")}catch(e){say(e.message)}}
async function load(){try{let [data,stats,reviewData]=await Promise.all([api("/api/subjects"),api("/api/stats"),api("/api/reviews")]);login.style.display="none";app.style.display="block";document.getElementById("stats").textContent=stats.completed+" من "+stats.total+" درس";document.getElementById("subjects").innerHTML=data.map(s=>'<div class="card"><h2>'+esc(s.title)+'</h2><ul>'+s.lessons.map(l=>'<li>'+esc(l.title)+' — '+(l.completed?'تمت الدراسة':'<button onclick="complete('+l.id+')">تمت الدراسة</button>')+'</li>').join("")+'</ul></div>').join("")||'<div class="card">لم تُضف مواد بعد.</div>';document.getElementById("reviews").innerHTML=reviewData.filter(r=>!r.completed_at).map(r=>'<div><b>'+esc(r.subject_title)+' — '+esc(r.lesson_title)+'</b> (مراجعة '+r.stage+')<p>الموعد: '+esc(r.due_at.slice(0,10))+'</p><select id="rating-'+r.lesson_id+'-'+r.stage+'"><option value="لم أتذكر">لم أتذكر</option><option value="تذكرت بصعوبة">تذكرت بصعوبة</option><option value="تذكرت معظم المعلومات">تذكرت معظم المعلومات</option><option value="أتقنت الدرس">أتقنت الدرس</option></select><button onclick="rate('+r.lesson_id+','+r.stage+')">إكمال المراجعة</button></div>').join("")||"لا توجد مراجعات معلقة";say("")}catch(e){say(e.message)}}
async function rate(id,stage){try{let rating=document.getElementById("rating-"+id+"-"+stage).value;await api("/api/reviews/"+id+"/"+stage+"/complete",{method:"POST",body:JSON.stringify({rating})});await load()}catch(e){say(e.message)}}
async function complete(id){try{await api("/api/lessons/"+id+"/complete",{method:"POST"});await load()}catch(e){say(e.message)}}
function logout(){sessionStorage.removeItem(key);location.reload()}
if(token())load();
</script></body></html>
