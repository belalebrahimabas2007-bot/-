name: Verify Engaz
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile server/main.py
      - name: Install dependencies
        run: pip install -r server/requirements.txt httpx
      - name: API smoke test
        run: python -m unittest discover -s server/tests -v
