name: Build Enjaz Android APKs
on:
  workflow_dispatch:
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apks.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enjaz-test-debug-keystore-v1
      - name: Determine APK version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "code=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Build both test APKs
        working-directory: android
        run: gradle --no-daemon assembleStudentDebug assembleAdminDebug -PreleaseVersionCode=${{ steps.version.outputs.code }}
      - name: Rename APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/student/debug/*.apk apk-output/Enjaz-Student.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk apk-output/Enjaz-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enjaz-Android-APKs
          path: apk-output/*.apk
          retention-days: 30
      - name: Publish installable update release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apk-output/Enjaz-Student.apk apk-output/Enjaz-Admin.apk --title "إنجاز $GITHUB_REF_NAME" --notes "تحديث تجريبي لتطبيقَي إنجاز" --latest


