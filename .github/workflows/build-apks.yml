name: Build Enjaz Android APKs
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number for publishing update (e.g. 2); leave blank for test APKs'
        required: false
        type: string
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apks.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure permanent signing key
        env:
          ENJAZ_KEYSTORE_BASE64: ${{ secrets.ENJAZ_KEYSTORE_BASE64 }}
          ENJAZ_KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ENJAZ_KEYSTORE_BASE64" || -z "$ENJAZ_KEYSTORE_PASSWORD" ]]; then
            echo 'Missing signing secrets; set permanent signing credentials before publishing APKs' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ENJAZ_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass "$ENJAZ_KEYSTORE_PASSWORD" -alias androiddebugkey >/dev/null
          echo "ENJAZ_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "ENJAZ_KEYSTORE_PASSWORD=$ENJAZ_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Determine APK version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            echo "code=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.head_commit.message }}" == "Publish Enjaz v2 in-app update" ]]; then
            echo "code=2" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "code=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "code=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        run: |
          [[ "${{ steps.version.outputs.code }}" =~ ^[1-9][0-9]*$ ]] || exit 1
      - name: Build both test APKs
        working-directory: android
        run: gradle --no-daemon assembleStudentDebug assembleAdminDebug -PreleaseVersionCode=${{ steps.version.outputs.code }}
      - name: Rename APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/student/debug/*.apk apk-output/Enjaz-Student.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk apk-output/Enjaz-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enjaz-Android-APKs
          path: apk-output/*.apk
          retention-days: 30
      - name: Publish installable update release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.event.head_commit.message == 'Publish Enjaz v2 in-app update')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.code }}"
          gh release create "$VERSION" apk-output/Enjaz-Student.apk apk-output/Enjaz-Admin.apk --target "$GITHUB_SHA" --title "إنجاز $VERSION" --notes "تحديث تجريبي لتطبيقَي إنجاز" --latest


