name: Build Enjaz Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apks.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: enjaz-test-debug-keystore-v1
      - name: Build both test APKs
        working-directory: android
        run: gradle --no-daemon assembleStudentDebug assembleAdminDebug
      - name: Rename APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/student/debug/*.apk apk-output/Enjaz-Student.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk apk-output/Enjaz-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enjaz-Android-APKs
          path: apk-output/*.apk
          retention-days: 30
