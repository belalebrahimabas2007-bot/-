name: Build Enjaz Android APKs
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version number for publishing update (e.g. 2); leave blank for test APKs'
        required: false
        type: string
  push:
    tags: ['v[0-9]*']
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apks.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configure permanent signing key
        env:
          ENJAZ_KEYSTORE_BASE64: ${{ secrets.ENJAZ_KEYSTORE_BASE64 }}
          ENJAZ_KEYSTORE_PASSWORD: ${{ secrets.ENJAZ_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ENJAZ_KEYSTORE_BASE64" || -z "$ENJAZ_KEYSTORE_PASSWORD" ]]; then
            echo 'Missing signing secrets; set permanent signing credentials before publishing APKs' >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ENJAZ_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass "$ENJAZ_KEYSTORE_PASSWORD" -alias androiddebugkey >/dev/null
          echo "ENJAZ_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "ENJAZ_KEYSTORE_PASSWORD=$ENJAZ_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Determine APK version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.release_version }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          code=1
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            code=${GITHUB_REF_NAME#v}
            publish=true
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            code=$REQUESTED_VERSION
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main &&
                  "$HEAD_MESSAGE" =~ ^Publish\ Enjaz\ v([1-9][0-9]*)\ in-app\ update$ ]]; then
            code=${BASH_REMATCH[1]}
            publish=true
          fi
          [[ "$code" =~ ^[1-9][0-9]*$ ]] || exit 1
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Build both test APKs
        working-directory: android
        run: gradle --no-daemon assembleStudentDebug assembleAdminDebug -PreleaseVersionCode=${{ steps.version.outputs.code }}
      - name: Rename APKs
        run: |
          mkdir -p apk-output
          cp android/app/build/outputs/apk/student/debug/*.apk apk-output/Enjaz-Student.apk
          cp android/app/build/outputs/apk/admin/debug/*.apk apk-output/Enjaz-Admin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Enjaz-Android-APKs
          path: apk-output/*.apk
          retention-days: 30
      - name: Verify update compatibility
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          previous=$(gh release view --json tagName --jq .tagName)
          [[ "$previous" =~ ^v[0-9]+$ && "$VERSION_CODE" -gt "${previous#v}" ]]
          gh release download "$previous" --pattern 'Enjaz-*.apk' --dir previous-apks
          tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          certificate() {
            "$tools/apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          }
          for edition in Student Admin; do
            filename="Enjaz-$edition.apk"
            package="com.enjaz.${edition,,}.preview"
            previous_cert=$(certificate "previous-apks/$filename")
            current_cert=$(certificate "apk-output/$filename")
            [[ -n "$previous_cert" && "$current_cert" == "$previous_cert" ]]
            "$tools/aapt" dump badging "apk-output/$filename" > "$edition-apk-badging.txt"
            grep -F "package: name='$package' versionCode='$VERSION_CODE'" "$edition-apk-badging.txt"
          done
      - name: Publish installable update release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.code }}"
          gh release create "$VERSION" apk-output/Enjaz-Student.apk apk-output/Enjaz-Admin.apk --target "$GITHUB_SHA" --title "إنجاز $VERSION" --notes "شاشة جديدة لتحديث التطبيق تعرض تقدم التنزيل وحجمه وسرعته في تطبيقي الطلاب والإدارة." --latest


