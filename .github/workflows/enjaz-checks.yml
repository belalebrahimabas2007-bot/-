name: Enjaz registration and frontend checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile backend Python
        run: python -m compileall -q server
      - name: Test registration and activation
        run: python -m unittest discover -s server/tests -v
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import pathlib
          import re
          for name in ('student', 'admin'):
              html = pathlib.Path(name, 'index.html').read_text(encoding='utf-8')
              scripts = re.findall(r'<script\b[^>]*>(.*?)</script>', html, flags=re.I | re.S)
              for idx, script in enumerate(scripts):
                  if script.strip():
                      pathlib.Path('/tmp', f'enjaz-{name}-{idx}.js').write_text(script, encoding='utf-8')
          PY
          for file in /tmp/enjaz-*.js; do node --check "$file"; done
