# Preview-only service. Add ENGAZ_ADMIN_USERNAME and ENGAZ_ADMIN_PASSWORD
# as private environment variables in the hosting dashboard.
# SQLite on an ephemeral filesystem is not durable on free hosting.
services:
  - type: web
    name: engaz-preview-api
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ENGAZ_ADMIN_USERNAME
        sync: false
      - key: ENGAZ_ADMIN_PASSWORD
        sync: false
      - key: ENGAZ_ALLOWED_ORIGINS
        sync: false
