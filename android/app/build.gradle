plugins { id 'com.android.application' }

android {
    namespace 'com.enjaz.preview'
    compileSdk 35
    defaultConfig {
        applicationId project.findProperty('appId') ?: 'com.enjaz.student.preview'
        minSdk 24
        targetSdk 35
        versionCode (project.findProperty('releaseVersionCode') ?: '1').toInteger()
        versionName (project.findProperty('releaseVersionCode') ?: '1') + '.0.0'
    }
    flavorDimensions 'audience'
    productFlavors {
        student { dimension 'audience'; applicationId 'com.enjaz.student.preview' }
        admin { dimension 'audience'; applicationId 'com.enjaz.admin.preview' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

 dependencies { implementation 'androidx.core:core:1.13.1' }
