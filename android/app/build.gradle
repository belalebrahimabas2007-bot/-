plugins { id 'com.android.application' }

android {
    namespace 'com.enjaz.preview'
    compileSdk 35
    defaultConfig {
        applicationId project.findProperty('appId') ?: 'com.enjaz.student.preview'
        minSdk 24
        targetSdk 35
        versionCode = Integer.parseInt(project.findProperty('releaseVersionCode')?.toString() ?: '1')
        versionName "${project.findProperty('releaseVersionCode') ?: '1'}.0.0"
    }
    flavorDimensions 'audience'
    productFlavors {
        student { dimension 'audience'; applicationId 'com.enjaz.student.preview' }
        admin { dimension 'audience'; applicationId 'com.enjaz.admin.preview' }
    }
    signingConfigs {
        permanent {
            storeFile file(System.getenv('ENJAZ_KEYSTORE_PATH') ?: "${System.getProperty("user.home")}/.android/debug.keystore")
            storePassword System.getenv('ENJAZ_KEYSTORE_PASSWORD') ?: 'android'
            keyAlias 'androiddebugkey'
            keyPassword System.getenv('ENJAZ_KEYSTORE_PASSWORD') ?: 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.permanent }
        release { minifyEnabled false; signingConfig signingConfigs.permanent }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

 dependencies { implementation 'androidx.core:core:1.13.1' }
